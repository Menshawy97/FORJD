name: CI

# Documentation-only changes skip CI entirely, on pull requests and on main alike. Nothing
# in these paths can affect a build, a test, or the conformance grep, so running the full
# suite for a roadmap edit costs ~6 minutes and proves nothing.
#
# `paths-ignore` skips a run only when EVERY changed file matches. A change touching both a
# doc and a source file still runs the whole suite — which is the behaviour that matters,
# since the risk with path filtering is skipping a run that was needed, not running one
# that wasn't.
#
# The two lists are duplicated because GitHub Actions does not support YAML anchors. Keep
# them identical: a path ignored on pull_request but not on push would run the suite at
# merge time for a change whose PR never ran it.
#
# Safe here only because `main` has no branch protection requiring these checks. If required
# status checks are ever enabled, a skipped workflow reports nothing and a docs-only PR
# would wait forever on a check that never arrives. At that point replace this with a filter
# job that always runs and reports success for docs-only changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.txt'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.txt'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'

# Least privilege: every job only checks out and runs code. Without this block the token gets
# the repository's default permission, which can be read-write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository this change touches, so a website-only or mobile-only change does not pay for the API suite (and
  # the other way round). The private repository's free Actions minutes ran short (2026-10-08: about 1,880 of 2,000 used in eight
  # days), and most of that was running every job for every change. Conformance is cheap and always runs. If the list of changed
  # files cannot be read, everything runs: skipping a needed job is the failure to avoid, not running an unneeded one.
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A pull request is checked out as a merge commit and a squash-merged push is one commit: either way HEAD^1 is the base.
          fetch-depth: 2
      - id: filter
        run: |
          files="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
          echo "Changed files:"; echo "$files"
          root='package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|.github/workflows/ci.yml$'
          match() { if [ -z "$files" ]; then echo true; elif echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          echo "api=$(match "^(apps/api/|packages/|scripts/ci/|$root)")" >> "$GITHUB_OUTPUT"
          echo "mobile=$(match "^(apps/mobile/|packages/|$root)")" >> "$GITHUB_OUTPUT"
          echo "web=$(match "^(apps/web/|$root)")" >> "$GITHUB_OUTPUT"

  conformance:
    name: Architecture conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/ci/check-architecture-conformance.sh
      - run: bash scripts/ci/check-architecture-conformance.test.sh

  api:
    name: API lint, build, test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forjd
          POSTGRES_PASSWORD: forjd_local_dev
          POSTGRES_DB: forjd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forjd -d forjd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://forjd:forjd_local_dev@localhost:5432/forjd
      # SupabaseAuthProvider and SupabaseStorageProvider build a client in their
      # constructor, so the DI graph fails to compile without these even when a test
      # overrides AUTH_PROVIDER — StorageProvider has no override yet and Nest still
      # instantiates every provider in the module tree. createClient makes no network
      # call at construction and e2e never invokes the client, so a well-formed but
      # fake value is correct here, not a workaround for a real credential.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      # Same reasoning as the two Supabase values above, for AiModule's vision client
      # (Phase 5, ADR-032/ADR-033): the client provider's factory calls config.getOrThrow
      # at module construction, so it runs even in body.e2e-spec.ts, which overrides
      # VISION_PROVIDER itself but not the separate *_VISION_CLIENT provider the module
      # tree still eagerly instantiates. No network call happens at construction, and no
      # test invokes this client, so a well-formed but fake value is correct here.
      # OPENAI_API_KEY is what AiModule actually needs to boot (ADR-033, production
      # vendor); NVIDIA_API_KEY is kept for nvidia-vision.provider.ts, still present as a
      # development-only option even though it is no longer the default binding.
      OPENAI_API_KEY: ci-placeholder-openai-key
      NVIDIA_API_KEY: ci-placeholder-nvidia-key
      # Same reasoning again, for Phase 7 (WHOOP): token-cipher.provider.ts,
      # whoop-client.ts, and whoop-oauth.service.ts's Provider factories all call
      # config.getOrThrow at module construction, and WhoopModule is now registered in
      # AppModule, so every e2e run boots the whole DI graph whether or not a given suite
      # touches WHOOP. TOKEN_ENCRYPTION_KEY here is a fixed, well-formed (32 raw bytes,
      # base64) but non-secret placeholder -- no test encrypts a real token in CI.
      TOKEN_ENCRYPTION_KEY: paiJIvNIQJEGHV0tsjDp9IQBc1GOTSPpxgjgIYK6Hf0=
      WHOOP_CLIENT_ID: ci-placeholder-whoop-client-id
      WHOOP_CLIENT_SECRET: ci-placeholder-whoop-client-secret
      WHOOP_REDIRECT_URI: forjd://whoop-callback
      # Read lazily per-request by WhoopController's webhook route, not at module
      # construction -- included anyway so whoop.e2e-spec.ts's real-signature tests have a
      # known, fixed secret to sign against.
      WHOOP_WEBHOOK_SECRET: ci-placeholder-whoop-webhook-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `@forjd/api...` selects the API and its workspace dependencies, built in dependency
      # order, so @forjd/domain and @forjd/contracts compile before the API that consumes
      # their emitted types (filtering to the API alone leaves them unbuilt). Not `pnpm -r
      # build`: that would also build apps/web, letting a website failure fail this job; the
      # web job builds the site on its own.
      - run: pnpm --filter "@forjd/api..." build

      # The city snapshot is a .json under src/, which `nest build` copies only because
      # nest-cli.json lists it as an asset (ADR-045). Without that entry it exists in development
      # and is missing from the container: a green CI, then a 500 on the first workout upload in
      # staging. Load it through the COMPILED code, from dist, so that cannot happen unnoticed.
      - run: node -e "const s = require('./apps/api/dist/cities/city-snapshot').loadCitySnapshotFromDisk(); if (s.count < 30000) process.exit(1); console.log('city snapshot ok:', s.count, 'rows')"

      # @forjd/domain has its own jest suite (exercise-vocabulary.spec.ts and onward) and no
      # Postgres dependency, so it runs here rather than getting a job of its own. `pnpm -r
      # build` above only type-checks these files as a build artifact; without this step they
      # would never actually execute in CI.
      #
      # test:cov, not test (R13): domain's own coverageThreshold gate in packages/domain/package.json
      # only fires under `--coverage`, mirroring the api job's `test:cov` step below.
      - run: pnpm --filter @forjd/domain test:cov

      # @forjd/contracts gained a real jest suite in Phase E (exercises.spec.ts) where its
      # `test` script had been an `echo "no tests yet"` stub. Same reasoning as the domain
      # step above: `pnpm -r build` only type-checks these files, so without this step the
      # 29 tests pinning the list envelope and the query coercions would never run in CI —
      # and the query schema is exactly where `?favourite=false` silently becoming `true`
      # would hide.
      #
      # test:cov, not test (R13): same reasoning as the domain step above.
      - run: pnpm --filter @forjd/contracts test:cov

      # Its `lint` script existed but nothing ran it, and the very first spec added to the
      # package shipped an eslint error that only a local run caught. `@forjd/domain` has the
      # same unrun `lint` script and is currently clean — worth adding, but out of this
      # phase's scope; it is recorded as a follow-up in docs/product/phase-2-plan.md.
      - run: pnpm --filter @forjd/contracts lint

      - run: pnpm --filter @forjd/api lint

      # Regenerating the contract fixtures must be a no-op. When it is not, a wire contract
      # changed and the committed fixtures are stale — which is the signal to go and check
      # the Flutter DTOs that mirror the same shapes by hand.
      - run: pnpm --filter @forjd/contracts fixtures

      - run: git diff --exit-code packages/contracts/fixtures

      # Same gate, same reason, for the normalized exercise catalogue (Phase D). Regenerating
      # the snapshot must be a no-op. When it is not, a mapping table or an override changed
      # and the committed snapshot is stale — and the diff is the review: it shows exactly
      # which of the 873 exercises changed category, goal or measure. A one-word edit to a
      # mapping table can silently reclassify a hundred exercises, so that edit does not get
      # to merge without the consequences visible beside it.
      - run: pnpm --filter @forjd/api exercises:normalize

      - run: git diff --exit-code apps/api/src/exercises/ingest/data/normalized-exercises.json

      # Same gate, for the food catalogue. Regenerating must be a no-op: the snapshot is the output
      # of the adapter plus the curation rules (zero-calorie, duplicates, food-exclusions.ts), so a
      # rule edit that was not regenerated -- or a snapshot edited by hand -- fails here, and the
      # diff of removed-foods.json shows exactly which foods a rule change added or restored.
      - run: pnpm --filter @forjd/api nutrition:normalize

      - run: git diff --exit-code apps/api/src/nutrition/ingest/data/normalized-foods.json apps/api/src/nutrition/ingest/data/removed-foods.json

      # Same gate, for the city snapshot (ADR-045). Regenerating from the committed cities.tsv must
      # be a no-op, so an edit to the slug or district rules that was not regenerated -- or a
      # snapshot edited by hand -- fails here, and the diff shows which cities changed slug.
      - run: pnpm --filter @forjd/api cities:normalize

      - run: git diff --exit-code apps/api/src/cities/ingest/data/normalized-cities.json

      # Same gate again, for the InBody vision-extraction prompt (CLAUDE.md rule 8, ADR-032).
      # Regenerating the golden prompt must be a no-op. When it is not, buildInBodyExtractionPrompt()
      # changed and the committed golden file is stale -- the diff is the review, since a
      # rephrasing here is a real behaviour change against a live vision model (see ADR-032's
      # own account of how much this exact wording mattered).
      - run: pnpm --filter @forjd/api prompt:golden

      - run: git diff --exit-code tests/fixtures/inbody

      # The Postgres service container starts empty. users.repository.spec.ts and the
      # e2e suite both need the real schema, not just a reachable server.
      - run: pnpm --filter @forjd/api db:migrate


      # test:cov, not test: the coverage thresholds in apps/api/package.json are the gate,
      # and running the suite without --coverage skips them entirely.
      - run: pnpm --filter @forjd/api test:cov

      # Serial, via `maxWorkers: 1` in test/jest-e2e.json — not a performance oversight.
      #
      # Every e2e suite boots the whole AppModule against the *same* Postgres, so in parallel
      # they mutate each other’s data. `GET /exercises/catalogue` returns a `catalogueVersion`
      # hashed over every row visible to the caller, and a catalogue row is visible to everyone —
      # so any other suite inserting or deleting one between two reads changes the hash and fails
      # "does not change the version when only a favourite toggles". That went red twice on
      # unrelated pull requests before this was understood.
      #
      # Owner-scoping the fixture exercises was tried first and is wrong: workout-sessions’
      # cross-user test needs an exercise *both* users can see, which is precisely a catalogue
      # row. Running the suites one at a time removes the whole class of interference instead of
      # the one instance, and costs a couple of minutes of wall clock.
      - run: pnpm --filter @forjd/api test:e2e

  mobile:
    name: Mobile lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app imports @forjd/contracts and @forjd/domain as workspace packages, and both
      # resolve through their built `dist/`. Without this the job fails on a clean checkout
      # with "Cannot find module '@forjd/contracts'" while passing locally, because a local
      # tree almost always has a stale dist/ lying around from an earlier build. Only these
      # two are built rather than `pnpm -r build` (what the api job does) because the app
      # depends on nothing else in the workspace.
      - run: pnpm --filter @forjd/domain --filter @forjd/contracts build

      - run: pnpm --filter @forjd/mobile typecheck

      - run: pnpm --filter @forjd/mobile lint

      # --ci --watchAll=false: Jest's own CI auto-detection turns off the interactive
      # watch-mode UI, but not the watch-mode plugins/prompts that still register the
      # process as attached to a TTY; passed explicitly so a runner never hangs waiting
      # for input. Runs all 35 tests (15 suites) under jest-expo.
      #
      # --coverage (R13): mobile's own coverageThreshold gate in apps/mobile/jest.config.js
      # only fires under this flag, mirroring the api job's `test:cov` step above.
      - run: pnpm --filter @forjd/mobile test:cov --ci --watchAll=false

      # expo-doctor is deliberately not wired in here yet. It runs without any account
      # or auth step (only npm registry access, which this job already has), but two of
      # its 21 checks currently fail against what's committed today: a metro.config.js
      # override it flags as risky, and expo-secure-store/expo-sqlite pinned behind the
      # SDK 57 versions it expects. Both are pre-existing dependency/config drift, not a
      # CI environment problem, and fixing them is app-config work outside this
      # CI-wiring change. Add the step once that drift is cleared — a step that fails on
      # every run from day one is worse than no step.

  web:
    name: Website check, test, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # getforjd.com (ADR-051). It depends on no other workspace package, so nothing is
      # built first. `check` type-checks the .astro pages as well as the .ts modules;
      # `build` is what Cloudflare Pages runs, so a page that fails here fails there too.
      - run: pnpm --filter @forjd/web check

      - run: pnpm --filter @forjd/web test

      - run: pnpm --filter @forjd/web build
