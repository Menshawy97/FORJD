name: Deploy API to Cloud Run

# Runs after "CI" finishes on main (workflow_run gates this on a green run of the same
# commit, not just a green PR — see the "post-merge CI" standing rule in CLAUDE.md/roadmap).
# workflow_dispatch exists for a manual staging/production redeploy without a new commit.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Cloud Run environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-api-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth's Workload Identity Federation

env:
  TARGET: ${{ inputs.target || 'staging' }}

jobs:
  # Splits the readiness check into its own job so a missing GCP setup shows as a skipped
  # `deploy` job (green) rather than a hard-failing `google-github-actions/auth` step (red)
  # on every push to main until the manual GCP credential setup — GCP_WORKLOAD_IDENTITY_PROVIDER,
  # GCP_DEPLOY_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_REGION (docs/product/roadmap.md slice 13)
  # — is done.
  check:
    name: Check deploy prerequisites
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] && [ -n "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" ] && [ -n "${{ vars.GCP_PROJECT_ID }}" ] && [ -n "${{ vars.GCP_REGION }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP deploy config not set yet (GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_REGION) — skipping deploy. See docs/product/roadmap.md slice 13."
          fi

  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.ready == 'true'
    environment: ${{ inputs.target || 'staging' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Workload Identity Federation, not a long-lived JSON service-account key — no GCP
      # credential is ever stored as a GitHub secret. GCP_WORKLOAD_IDENTITY_PROVIDER and
      # GCP_DEPLOY_SERVICE_ACCOUNT are repo/environment *variables* (not secrets): they name
      # a provider and principal, not a credential.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/forjd/api:${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run database migrations and seed the catalogues and programs
        # Pulled from Secret Manager (forjd-<target>-database-url), not a GitHub secret, so
        # the hosted DB credential lives in exactly one place. Must be the Supabase *session
        # pooler* connection string — the direct connection string fails over IPv6 from
        # GitHub-hosted runners (see docs/product/roadmap.md's IPv6 finding).
        #
        # `exercises:load` and `nutrition:load` both run after `db:migrate` and before the
        # deploy, so a new revision never comes up serving an empty library or an empty food
        # catalogue. Neither is a migration because their content rows (873 exercises, ~13,700
        # foods) are not schema, and both are safe on every deploy because they are idempotent:
        # each upsert is keyed on `(source, source_id)` and backed by a partial unique index, so
        # a re-run updates in place and cannot duplicate a row. Both read only their own
        # committed snapshot, never the raw dataset — enforced by
        # scripts/ci/check-architecture-conformance.sh.
        #
        # The workspace packages must be BUILT before either loader, not merely installed. They
        # run under ts-node on the runner (not inside the image), and their import graph reaches
        # `@forjd/domain`/`@forjd/contracts`, which resolve through `dist/`. `db:migrate` gets
        # away without this because drizzle-kit only reads the schema files, which import
        # nothing from the workspace — so the first run of `exercises:load` in this step failed
        # on `Cannot find module '@forjd/domain'` after the migration had already applied. A
        # local run cannot reproduce that: a developer tree almost always has a stale `dist/`
        # lying around. Same reasoning, same fix as the mobile job in ci.yml.
        #
        # `programs:seed` runs last of the three and depends on `exercises:load`: 24 of the 28
        # exercise names the nine preset programs use resolve to ingested catalogue rows, so it
        # fails loudly naming the missing slugs rather than seeding a program short of a lift. It
        # is idempotent on the same terms — a program is keyed by its slug through the
        # `programs_preset_slug_key` partial unique index, and its workout templates are found
        # again through the `program_workouts` join rows, so template ids stay stable across
        # deploys and the sessions performed against a preset are never orphaned.
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @forjd/domain --filter @forjd/contracts build
          export DATABASE_URL="$(gcloud secrets versions access latest --secret="forjd-${TARGET}-database-url")"
          pnpm --filter @forjd/api db:migrate
          pnpm --filter @forjd/api exercises:load
          pnpm --filter @forjd/api nutrition:load
          pnpm --filter @forjd/api programs:seed

      - name: Mirror exercise media
        # ADR-018 / Phase F. Separate step, not folded into the one above, because it needs
        # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY (StorageProvider's credentials) rather than
        # DATABASE_URL, and keeping the two apart means a Storage failure shows up as its own
        # red step instead of inside "Run database migrations...". Same idempotency argument
        # as exercises:load: it checks each object before uploading, so a re-run after a
        # partial failure -- or simply the next deploy -- only mirrors what is still missing.
        #
        # `continue-on-error: true`: the script itself never aborts early (a per-key fetch
        # failure is caught, logged and counted, not thrown -- see mirror-media.ts), but it
        # does exit non-zero when any key failed, so the step is flagged here without ever
        # blocking the code deploy that follows. Confirmed live against the pinned commit
        # while validating this phase: one upstream image path 400s from
        # raw.githubusercontent.com specifically (not a systemic failure -- 39/39 other
        # sampled real keys returned 200, and the same bytes fetch fine through GitHub's
        # git-blob API), which is exactly the class of external flakiness that must not gate
        # shipping a code change.
        continue-on-error: true
        run: |
          export SUPABASE_URL="$(gcloud secrets versions access latest --secret="forjd-${TARGET}-supabase-url")"
          export SUPABASE_SERVICE_ROLE_KEY="$(gcloud secrets versions access latest --secret="forjd-${TARGET}-supabase-service-role-key")"
          pnpm --filter @forjd/api exercises:mirror-media

      - name: Deploy to Cloud Run
        run: |
          # EXERCISE_MEDIA_BASE_URL (ADR-018 / Phase F) is Supabase Storage's own default
          # public-bucket URL pattern, derived from SUPABASE_URL rather than held as a
          # separate secret -- it names no credential, and deriving it here means there is
          # nothing to keep in sync if the project's URL ever changes.
          SUPABASE_URL_VALUE="$(gcloud secrets versions access latest --secret="forjd-${TARGET}-supabase-url")"
          gcloud run deploy "forjd-api-${TARGET}" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets "SUPABASE_URL=forjd-${TARGET}-supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=forjd-${TARGET}-supabase-service-role-key:latest,DATABASE_URL=forjd-${TARGET}-database-url:latest" \
            --set-env-vars "EXERCISE_MEDIA_BASE_URL=${SUPABASE_URL_VALUE}/storage/v1/object/public/exercise-media"
