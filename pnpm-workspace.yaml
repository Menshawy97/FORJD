packages:
  - "apps/api"
  - "apps/mobile"
  - "packages/*"

# drizzle-kit ships its CLI as an esbuild bundle and needs esbuild's postinstall to
# place the platform binary. pnpm blocks build scripts by default; this allows that
# one package rather than disabling the protection wholesale.
# dtrace-provider (a transitive dep of eas-cli's bunyan logger) only builds DTrace probes
# for macOS/Solaris; its install script is a no-op everywhere this project runs (Windows
# dev, Linux CI), so it's left unapproved rather than granted script execution.
allowBuilds:
  dtrace-provider: false
  esbuild: true

# R11 (audit-remediation-plan.md), ADR-038: pnpm audit findings that resolve cleanly without
# touching eas-cli (apps/mobile devDependency, dev/CI-tooling-only -- see the ADR for why its
# own vulnerable subtree, node-forge/tar/minimatch/ajv/diff, is left alone). qs and multer are
# on apps/api's actual request path (express body parsing, multipart upload handling); the
# rest are dev-tooling-only but resolve for free. See ADR-038 for the full audit and the
# eas-cli rationale.
overrides:
  qs: ">=6.16.0"
  multer: ">=2.4.0"
  esbuild: ">=0.24.3"
  fast-uri: ">=3.1.6"
  "uuid@<11.1.1": ">=11.1.1"
  decode-uri-component: ">=0.4.3"
  "js-yaml@<3.15.2": ">=3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2"
  "@xmldom/xmldom": ">=0.9.12"
